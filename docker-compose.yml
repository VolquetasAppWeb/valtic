name: valtic

services:
  postgres:
    image: postgres:16-alpine
    container_name: valtic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-valtic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-valtic_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-valtic}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - valtic_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-valtic}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: valtic-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - valtic_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: valtic-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-valtic}:${POSTGRES_PASSWORD:-valtic_dev_password}@postgres:5432/${POSTGRES_DB:-valtic}?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/node_modules

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: valtic-web
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/node_modules

volumes:
  valtic_postgres_data:
  valtic_redis_data:
